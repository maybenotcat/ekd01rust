[package]
name = "ekd01-ble-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
btleplug = "0.11.8"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = "1"
slint = { version = "=1.15.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "=1.15.1"
serde_json = "1"
