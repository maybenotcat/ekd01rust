[package]
name = "ekd01rust-parity"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ekd01-board = { path = "../../ekd01-board" }
mt2502-hal = { path = "../../mt2502-hal" }
bitflags = "2"
critical-section = { version = "1.2", features = ["std"] }
littlefs_rust = { package = "littlefs2-rust", path = "../../third_party/littlefs_rust", default-features = false }

[dev-dependencies]
rspolib = "=0.1.2"
slint = { version = "=1.15.1", default-features = false, features = ["compat-1-2", "std", "renderer-software"] }

[build-dependencies]
slint-build = "=1.15.1"

[patch.crates-io]
i-slint-compiler = { path = "../../third_party/slint-compiler" }

[lib]
path = "lib.rs"

[profile.test]
opt-level = 1
debug = 0
