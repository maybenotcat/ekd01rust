[build]
target = "armv5te-none-eabi"
jobs = 2

[alias]
# host-tuple is resolved by Cargo on each OS. Rebuild host std as well as core
# here, since the firmware's global build-std otherwise mixes two core crates.
xtask = "run --locked --package xtask --target host-tuple -Zbuild-std=std,panic_abort --"
flasher = "run --locked --package ekd01-flasher --target host-tuple -Zbuild-std=std,panic_abort --"
ble-client = "run --locked --release --package ekd01-ble-client --target host-tuple -Zbuild-std=std,panic_abort --"
build-ble-client = "build --locked --release --package ekd01-ble-client --target host-tuple -Zbuild-std=std,panic_abort"

[env]
SLINT_FONT_ATLAS_CONFIG = { value = "config/font-atlases.txt", relative = true }
SLINT_FONT_ATLAS_REPORT = { value = "build/font-atlases.tsv", relative = true }
RAYON_NUM_THREADS = "2"

[target.armv5te-none-eabi]
rustflags = ["-C", "relocation-model=static"]

[target.thumbv5te-none-eabi]
rustflags = ["-C", "relocation-model=static"]

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]



